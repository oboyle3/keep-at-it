<!DOCTYPE html>
<html>
<head>
    <title>Wordle</title>
</head>
<body>
      <style>
        body {
            background-color: #1e1e2e; /* Soft dark background */
            color: #cdd6f4;            /* Off-white/light gray text */
            font-family: sans-serif;   /* Cleaner font for easier reading */
            padding: 20px;
        }
    </style>

    <h1>Wordle</h1>
    <p style="text-align: center;">Rand word = {{ rand_word }}.</p>
    <p>Welcome to Wordle!</p>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="guess" placeholder="enter a word">
        <button type="submit">Gues</button>
    </form>
    {{ message_to_user }}

    <p> {{ message_of_correct_letter }}</p>
    <p>{{  message_of_user_win  }}</p>
    <p1>{{ letters_in }}</p1>
</body>
</html>
